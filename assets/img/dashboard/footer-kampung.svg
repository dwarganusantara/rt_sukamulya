<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" preserveAspectRatio="xMidYMax meet">
  <!-- Ilustrasi footer portal warga: kampung (kiri) & taman gazebo (kanan). Tanpa teks agar identitas tetap dinamis. -->
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e2531c"/></linearGradient>
    <linearGradient id="roof2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f26a3a"/><stop offset="1" stop-color="#c8401a"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f3e6d3"/></linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd36b"/><stop offset="1" stop-color="#2f9a45"/></linearGradient>
    <linearGradient id="tree2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58c25c"/><stop offset="1" stop-color="#23803a"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fdc6e"/><stop offset="1" stop-color="#4fb44f"/></linearGradient>
    <linearGradient id="groof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2453a"/><stop offset="1" stop-color="#a51d24"/></linearGradient>
  </defs>
  <!-- ===== KIRI: kampung ===== -->
  <g>
    <path d="M0 150Q120 128 260 138T540 150V200H0Z" fill="url(#grass)"/>
    <!-- pohon belakang -->
    <rect x="34" y="88" width="10" height="60" rx="4" fill="#8a5a3b"/><circle cx="39" cy="78" r="34" fill="url(#tree2)"/><circle cx="20" cy="92" r="22" fill="url(#tree)"/>
    <rect x="486" y="96" width="9" height="52" rx="4" fill="#8a5a3b"/><circle cx="490" cy="86" r="30" fill="url(#tree2)"/><circle cx="510" cy="100" r="19" fill="url(#tree)"/>
    <!-- rumah 1 -->
    <rect x="70" y="112" width="96" height="48" fill="url(#wall)"/>
    <path d="M58 116 118 74 178 116Z" fill="url(#roof)"/><path d="M58 116 118 74 178 116" fill="none" stroke="#b9461a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="108" y="128" width="20" height="32" rx="2" fill="#a0532d"/><rect x="80" y="124" width="18" height="16" rx="2" fill="#7cc6ff"/><rect x="138" y="124" width="18" height="16" rx="2" fill="#7cc6ff"/>
    <!-- rumah 2 (lebih besar) -->
    <rect x="186" y="100" width="128" height="60" fill="url(#wall)"/>
    <path d="M172 104 250 52 328 104Z" fill="url(#roof2)"/><path d="M172 104 250 52 328 104" fill="none" stroke="#9e3412" stroke-width="3" stroke-linejoin="round"/>
    <rect x="238" y="120" width="24" height="40" rx="2" fill="#8f4422"/><rect x="198" y="116" width="26" height="20" rx="2" fill="#7cc6ff"/><rect x="276" y="116" width="26" height="20" rx="2" fill="#7cc6ff"/>
    <path d="M211 116v20M289 116v20M198 126h26M276 126h26" stroke="#fff" stroke-width="2"/>
    <!-- rumah 3 -->
    <rect x="336" y="116" width="92" height="44" fill="url(#wall)"/>
    <path d="M324 120 382 82 440 120Z" fill="url(#roof)"/><path d="M324 120 382 82 440 120" fill="none" stroke="#b9461a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="372" y="132" width="20" height="28" rx="2" fill="#a0532d"/><rect x="346" y="128" width="16" height="14" rx="2" fill="#7cc6ff"/><rect x="402" y="128" width="16" height="14" rx="2" fill="#7cc6ff"/>
    <!-- pagar & semak -->
    <g fill="#fff" stroke="#d9c6ae" stroke-width="1.5">
      <rect x="60" y="150" width="380" height="5" rx="2"/>
      <path d="M66 140h7v22h-7zM96 140h7v22h-7zM176 140h7v22h-7zM206 140h7v22h-7zM330 140h7v22h-7zM432 140h7v22h-7z"/>
    </g>
    <g fill="url(#tree)"><circle cx="30" cy="160" r="18"/><circle cx="58" cy="166" r="14"/><circle cx="168" cy="166" r="15"/><circle cx="452" cy="164" r="17"/><circle cx="480" cy="168" r="13"/></g>
    <g fill="#ff6b8a"><circle cx="26" cy="152" r="3"/><circle cx="40" cy="160" r="3"/><circle cx="455" cy="156" r="3"/><circle cx="470" cy="166" r="3"/></g>
  </g>
  <!-- ===== KANAN: taman & gazebo ===== -->
  <g>
    <path d="M1060 150Q1200 130 1340 140T1600 146V200H1060Z" fill="url(#grass)"/>
    <rect x="1556" y="84" width="11" height="66" rx="4" fill="#8a5a3b"/><circle cx="1562" cy="72" r="38" fill="url(#tree2)"/><circle cx="1590" cy="92" r="24" fill="url(#tree)"/>
    <rect x="1108" y="94" width="10" height="56" rx="4" fill="#8a5a3b"/><circle cx="1113" cy="84" r="32" fill="url(#tree2)"/><circle cx="1090" cy="98" r="20" fill="url(#tree)"/>
    <!-- gazebo -->
    <rect x="1270" y="100" width="7" height="58" fill="#9b5b35"/><rect x="1383" y="100" width="7" height="58" fill="#9b5b35"/><rect x="1326" y="104" width="7" height="54" fill="#8a4f2d"/>
    <rect x="1262" y="138" width="136" height="7" rx="2" fill="#b77245"/>
    <path d="M1240 104 1330 54 1420 104Z" fill="url(#groof)"/><path d="M1252 104h156l-6 8h-144z" fill="#7f1018"/>
    <path d="M1240 104 1330 54 1420 104" fill="none" stroke="#7f1018" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1316 52h28l-14-12z" fill="#a51d24"/><circle cx="1330" cy="38" r="4" fill="#ffd34d"/>
    <path d="M1250 158h160" stroke="#c8935f" stroke-width="6" stroke-linecap="round"/>
    <!-- semak & bunga -->
    <g fill="url(#tree)"><circle cx="1180" cy="162" r="19"/><circle cx="1210" cy="168" r="14"/><circle cx="1246" cy="166" r="15"/><circle cx="1428" cy="164" r="18"/><circle cx="1462" cy="168" r="14"/><circle cx="1510" cy="162" r="20"/></g>
    <g fill="#ffd34d"><circle cx="1178" cy="154" r="3"/><circle cx="1214" cy="161" r="3"/><circle cx="1432" cy="156" r="3"/><circle cx="1506" cy="154" r="3"/></g>
    <g fill="#ff6b8a"><circle cx="1194" cy="160" r="3"/><circle cx="1452" cy="162" r="3"/><circle cx="1520" cy="164" r="3"/></g>
  </g>
</svg>
